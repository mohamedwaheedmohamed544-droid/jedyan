# Netlify — Next.js Runtime v5
# The runtime turns the Next.js build into Netlify Functions automatically.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Postgres is used on Netlify; skip the optional native SQLite driver so the
  # function bundler never has to deal with a .node binary.
  NPM_FLAGS = "--no-optional"
  # Netlify's secret scanner flags the connection string / password inside the
  # build output and fails the deploy. These keys are server-only env vars.
  SECRETS_SCAN_OMIT_KEYS = "DATABASE_URL,POSTGRES_URL,NETLIFY_DATABASE_URL,ADMIN_EMAIL,ADMIN_PASSWORD"
  SECRETS_SCAN_OMIT_PATHS = ".next/**,node_modules/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# `pg` is a Node driver with dynamic requires — keep it outside the bundle.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "pg-native", "better-sqlite3"]
